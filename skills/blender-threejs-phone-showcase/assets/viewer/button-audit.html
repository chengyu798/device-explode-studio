<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>侧边键修复核对</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f3f3;color:#292d33;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1440px;margin:auto;padding:28px 36px}header{display:flex;justify-content:space-between;gap:20px}h1{font-size:26px;margin:0 0 6px}p{margin:0;color:#626b76}a{color:inherit}header>a{height:42px;border:1px solid #ccd0d5;border-radius:8px;padding:8px 15px;text-decoration:none;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}article{border:1px solid #d4d8dd;border-radius:12px;overflow:hidden;background:#fff}h2{font-size:17px;margin:0;padding:12px 17px}img{display:block;width:100%;height:auto}article p{padding:11px 16px;font-size:13px;border-top:1px solid #d4d8dd}footer{margin-top:22px;border-top:1px solid #d1d4d9;padding-top:15px;color:#5f6874;font-size:13px}.dot{display:inline-block;height:11px;width:11px;border-radius:50%;margin-right:8px}@media(max-width:760px){main{padding:20px}.grid{grid-template-columns:1fr}header{display:block}header>a{display:inline-block;margin-top:12px}}</style></head>
<body><main><header><div><h1>侧边键修复核对</h1><p>右侧侧边键 · 同一位置、同一灯光下的三色近景</p></div><a href="./">返回交互模型 ↗</a></header>
<div class="grid">
<article><h2><span class="dot" style="background:#d1d3d5"></span>银色</h2><a href="./review/buttons-silver-power.png"><img src="./review/buttons-silver-power.png" alt="银色侧边键，金属键面完整显示，窄黑色密封边居中"></a><p>银色金属键面，与边框使用同一配色。</p></article>
<article><h2><span class="dot" style="background:#df873b"></span>星宇橙色</h2><a href="./review/buttons-orange-power.png"><img src="./review/buttons-orange-power.png" alt="橙色侧边键，键面与机身同色，完整覆盖密封圈中央"></a><p>橙色金属键面，保留独立的窄密封边。</p></article>
<article><h2><span class="dot" style="background:#39435b"></span>深蓝色</h2><a href="./review/buttons-blue-power.png"><img src="./review/buttons-blue-power.png" alt="深蓝色侧边键，键面为深蓝色而非缺失的黑色空洞"></a><p>深蓝金属键面，深色反光随观察角度变化。</p></article>
</div>
<footer>按键与密封圈共用边框厚度中线，已修正内向面造成的键面剔除。机械按键外表面比边框凸出 0.45 mm；相机控制键保持近齐平高度。<br><a href="./review/buttons-silver-right.png">查看完整右侧</a> · <a href="./review/buttons-silver-left.png">查看完整左侧</a> · 在交互模型中点击“右”或“左”直接检查。</footer>
</main></body></html>
